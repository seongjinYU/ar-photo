<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000" />
  <title>기도하는 예수님 · 마커 AR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; color:#fff; }
    #container { position: fixed; inset: 0; }
    #banner { position: fixed; top: 0; left: 0; right: 0; z-index: 30; text-align: center;
      padding: max(env(safe-area-inset-top), 14px) 16px 12px; font-size: 14px; font-weight: 600;
      background: linear-gradient(180deg, rgba(0,0,0,0.6), rgba(0,0,0,0)); pointer-events:none; }
    #log { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 8px 12px;
      font-size: 11.5px; line-height: 1.45; background: rgba(0,0,0,0.6); white-space: pre-wrap;
      word-break: break-all; max-height: 40%; overflow:auto; display:none; }
    .ok{color:#6ee787;} .err{color:#ff7b72;} .info{color:#79c0ff;}
    #err { position: fixed; inset: 0; z-index: 40; display:none; flex-direction:column;
      align-items:center; justify-content:center; gap:12px; padding:28px; text-align:center; background:#000; }
    #err.show{ display:flex; }
    #err button{ padding:12px 24px;border:none;border-radius:999px;background:#e8c98a;color:#1a1405;font-weight:700;font-size:15px; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"></div>
  <div id="banner"><span id="bannerText">카메라 준비 중…</span></div>
  <div id="log"></div>
  <div id="err">
    <h2 id="errTitle">문제가 발생했어요</h2>
    <p id="errMsg" style="color:#b9bdd4;font-size:14px;max-width:320px;line-height:1.6;"></p>
    <button onclick="location.reload()">다시 시도</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MindARThree } from 'mindar-image-three';

    const logEl = document.getElementById('log');
    const bannerText = document.getElementById('bannerText');
    function log(m, cls){ const d=document.createElement('div'); if(cls)d.className=cls; d.textContent=m; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
    function showErr(t, m){ document.getElementById('errTitle').textContent=t; document.getElementById('errMsg').innerHTML=m; document.getElementById('err').classList.add('show'); }

    // URL로 캐릭터 크기/회전/위치 조정 (?s=0.4&rx=90&y=0)
    const q = new URLSearchParams(location.search);
    const num = (k,d)=>{ const v=parseFloat(q.get(k)); return isNaN(v)?d:v; };
    const S  = num('s', 0.5);
    const RX = num('rx', 0) * Math.PI/180;
    const RY = num('ry', 0) * Math.PI/180;
    const RZ = num('rz', 0) * Math.PI/180;
    const PY = num('y', 0), PX = num('x', 0), PZ = num('z', 0);
    if (q.get('debug') === '1') logEl.style.display = 'block';

    async function main(){
      try {
        log('MindARThree 초기화…', 'info');
        const mindarThree = new MindARThree({
          container: document.getElementById('container'),
          imageTargetSrc: './assets/target.mind',
          uiLoading: 'no', uiScanning: 'no', uiError: 'no',
        });
        const { renderer, scene, camera } = mindarThree;

        // 조명
        scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.1));
        const dir = new THREE.DirectionalLight(0xffffff, 1.0); dir.position.set(1,2,1); scene.add(dir);

        // 모델 로드 (Draco 압축본)
        log('3D 모델 로드…', 'info');
        const draco = new DRACOLoader();
        draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/libs/draco/');
        const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
        const gltf = await loader.loadAsync('./assets/model-opt.glb');
        const model = gltf.scene;
        model.scale.set(S,S,S);
        model.rotation.set(RX,RY,RZ);
        model.position.set(PX,PY,PZ);
        log('✅ 모델 로드 완료', 'ok');

        const anchor = mindarThree.addAnchor(0);
        anchor.group.add(model);
        anchor.onTargetFound = () => { bannerText.textContent = '찾았어요! 🙏'; };
        anchor.onTargetLost  = () => { bannerText.textContent = '마커(그림)에 카메라를 비춰주세요'; };

        // 카메라 시작 (권한 요청 → 자동 시작)
        log('카메라 시작 요청…', 'info');
        await mindarThree.start();
        log('✅ 카메라 시작됨', 'ok');
        bannerText.textContent = '마커(그림)에 카메라를 비춰주세요';

        // ★ 핵심: MindAR 카메라 영상을 3D 캔버스 배경 텍스처로 직접 그림 (iOS 검은화면 우회)
        const video = mindarThree.video;
        const tex = new THREE.VideoTexture(video);
        tex.colorSpace = THREE.SRGBColorSpace;
        const bgScene = new THREE.Scene();
        const bgCam = new THREE.Camera();
        const bgMat = new THREE.MeshBasicMaterial({ map: tex, depthTest:false, depthWrite:false });
        const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2,2), bgMat);
        bgScene.add(bgMesh);

        function cover(){
          const vw = video.videoWidth, vh = video.videoHeight;
          if (!vw || !vh) return;
          const va = vw/vh, sa = window.innerWidth/window.innerHeight;
          let rx=1, ry=1;
          if (va > sa) { rx = sa/va; } else { ry = va/sa; }
          tex.repeat.set(rx, ry);
          tex.offset.set((1-rx)/2, (1-ry)/2);
        }

        renderer.autoClear = false;
        renderer.setAnimationLoop(() => {
          cover();
          renderer.clear();
          renderer.render(bgScene, bgCam);   // 카메라 영상(배경)
          renderer.clearDepth();
          renderer.render(scene, camera);     // 마커에 고정된 3D
        });
        log('✅ 렌더 루프 시작 (배경=카메라 텍스처)', 'ok');
      } catch (e) {
        log('❌ ' + (e && (e.name+': '+e.message) || e), 'err');
        const msg = (e && e.name === 'NotAllowedError')
          ? '카메라 권한이 거부됐어요. 사파리 설정에서 카메라를 허용해 주세요.'
          : '오류: ' + (e && e.message || e) + '<br/>(사파리에서 열었는지, HTTPS인지 확인해 주세요.)';
        showErr('카메라를 시작할 수 없어요', msg);
      }
    }
    main();
  </script>
</body>
</html>
