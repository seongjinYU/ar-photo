<!doctype html>
<html lang="ko">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>리빙포토</title>

  <script crossorigin="anonymous" src="/8w/external/scripts/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>

  <style>
    html, body { margin:0; height:100%; background:#0c0e1c; overflow:hidden;
      font-family:-apple-system,"Apple SD Gothic Neo",sans-serif; color:#f4f5fb; }
    .full { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:16px; text-align:center; padding:24px;
      background:radial-gradient(120% 80% at 50% 0%, #2a3160 0%, #1a1f3a 42%, #0c0e1c 100%); }
    .icon { width:72px; height:72px; color:#e8c98a; animation:breathe 2.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    .t { font-size:19px; font-weight:700; }
    .s { font-size:13.5px; color:#b9bdd4; line-height:1.7; }
    .spin { width:44px; height:44px; border-radius:50%; border:3px solid rgba(232,201,138,.25);
      border-top-color:#e8c98a; animation:sp .9s linear infinite; }
    @keyframes sp { to { transform:rotate(360deg); } }
    #bar { position:fixed; left:0; right:0; bottom:max(env(safe-area-inset-bottom),14px);
      display:none; justify-content:center; gap:10px; z-index:50; }
    #bar button { padding:12px 18px; border:none; border-radius:999px; font-size:14px; font-weight:700;
      background:rgba(255,255,255,0.14); color:#fff; backdrop-filter:blur(8px); }
    #err { position:fixed; left:12px; right:12px; top:max(env(safe-area-inset-top),12px); z-index:150;
      display:none; background:rgba(160,40,40,.92); border-radius:12px; padding:12px 14px;
      font-size:12.5px; line-height:1.5; word-break:break-all; }
  </style>
</head>
<body>
  <div class="full" id="gate" style="cursor:pointer">
    <div class="spin" id="gspin"></div>
    <svg class="icon" id="gicon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3 3 7.5v9L12 21l9-4.5v-9L12 3z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>
    </svg>
    <div class="t" id="gt">영상을 찾는 중…</div>
    <div class="s" id="gs">잠시만요</div>
  </div>

  <div class="full" id="inapp" style="display:none">
    <div class="t">외부 브라우저로 열어주세요</div>
    <div class="s">카카오톡·인스타 앱 안에서는 카메라 AR이 안 돼요.<br>
      우측 상단 <b>⋮ / 공유</b> → <b>"다른 브라우저로 열기"</b><br>(안드로이드: Chrome / 아이폰: Safari)</div>
    <button onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href).then(()=>this.textContent='복사됨 ✓')"
      style="padding:12px 22px;border:none;border-radius:999px;background:#e8c98a;color:#1a1405;font-weight:700;font-size:14px;">링크 복사</button>
  </div>

  <div id="bar">
    <button id="bPrev">‹</button>
    <button id="bPage" style="pointer-events:none">1 / 1</button>
    <button id="bNext">›</button>
    <button id="bSnd">🔇</button>
  </div>
  <div id="err"></div>

  <div id="media" style="display:none"></div>

  <script>
    // ---- token & 옵션 ----
    const token = (location.pathname.match(/\/v\/([a-z0-9-]{3,24})/i) || [,''])[1].toLowerCase()
                || new URLSearchParams(location.search).get('t') || '';
    const q = new URLSearchParams(location.search);
    const KEY = '#' + (q.get('k') || '00ff00');      // 부스 배경색 (기본 초록)
    // s=카드 위에 수직으로 서서 회전(기본) / c=누끼(그린스크린) / a=액자(카드에 눕힘)
    const FX = (q.get('fx') || 's').toLowerCase();
    const SPIN = q.get('spin') !== '0';              // ?spin=0 이면 회전 정지
    const SPIN_MS = Math.max(2000, +(q.get('spinms') || 9000));
    // ── 프레임/애니메이션 튜닝 (폰에서 URL로 즉석 조절) ──
    const GOLD    = '#' + (q.get('gold') || 'e8c98a');           // 액자 금색
    const BOB     = Math.max(0, +(q.get('bob')  ?? 0.02));        // 부유 진폭(m). 0이면 끔
    const BOB_MS  = Math.max(500, +(q.get('bobms')  || 3200));    // 부유 한 주기(ms)
    const ENTER_MS= Math.max(0, +(q.get('enter') ?? 620));        // 등장 팝 길이(ms). 0이면 즉시

    const UA = navigator.userAgent;
    const IN_APP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|; wv\)/i.test(UA);
    const NOSLAM = /[?&]noslam=1/.test(location.search);
    if (IN_APP) { document.getElementById('gate').style.display='none'; document.getElementById('inapp').style.display='flex'; }

    // ---- 마커(카드) 타깃: 융합카드 + 디자인 3종 ----
    const imageTargetData = [
      {"type":"PLANAR","properties":{"top":0,"left":0,"width":900,"height":900,"isRotated":false,"originalWidth":900,"originalHeight":900},"imagePath":"/8w/image-targets/fused_luminance.jpg","metadata":null,"name":"fused","resources":{"originalImage":"fused_original.jpg","croppedImage":"fused_cropped.jpg","thumbnailImage":"fused_thumbnail.jpg","luminanceImage":"fused_luminance.jpg"},"created":1777000000000,"updated":1777000000000},
      {"type":"PLANAR","properties":{"top":0,"left":0,"width":900,"height":1180,"isRotated":false,"originalWidth":900,"originalHeight":1180},"imagePath":"/8w/image-targets/card1_luminance.jpg","metadata":null,"name":"card1","resources":{"originalImage":"card1_original.jpg","croppedImage":"card1_cropped.jpg","thumbnailImage":"card1_thumbnail.jpg","luminanceImage":"card1_luminance.jpg"},"created":1777000000000,"updated":1777000000000},
      {"type":"PLANAR","properties":{"top":0,"left":0,"width":900,"height":1180,"isRotated":false,"originalWidth":900,"originalHeight":1180},"imagePath":"/8w/image-targets/card2_luminance.jpg","metadata":null,"name":"card2","resources":{"originalImage":"card2_original.jpg","croppedImage":"card2_cropped.jpg","thumbnailImage":"card2_thumbnail.jpg","luminanceImage":"card2_luminance.jpg"},"created":1777000000000,"updated":1777000000000},
      {"type":"PLANAR","properties":{"top":0,"left":0,"width":900,"height":1180,"isRotated":false,"originalWidth":900,"originalHeight":1180},"imagePath":"/8w/image-targets/card3_luminance.jpg","metadata":null,"name":"card3","resources":{"originalImage":"card3_original.jpg","croppedImage":"card3_cropped.jpg","thumbnailImage":"card3_thumbnail.jpg","luminanceImage":"card3_luminance.jpg"},"created":1777000000000,"updated":1777000000000}
    ];
    const onxrloaded = () => { XR8.XrController.configure({ imageTargetData }); };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);

    const NAMES = ['fused','card1','card2','card3'];
    AFRAME.registerComponent('persist-any-target', {
      init: function () {
        const obj = this.el.object3D; obj.visible = false;
        const sync = (e) => {
          const d = e.detail; if (!d || !NAMES.includes(d.name)) return;
          if (d.position) obj.position.set(d.position.x, d.position.y, d.position.z);
          if (d.rotation) obj.quaternion.set(d.rotation.x, d.rotation.y, d.rotation.z, d.rotation.w);
          if (typeof d.scale === 'number') obj.scale.set(d.scale, d.scale, d.scale);
          obj.visible = true;
        };
        this.el.sceneEl.addEventListener('xrimagefound', sync);
        this.el.sceneEl.addEventListener('xrimageupdated', sync);
        // 마커를 (다시) 잡는 순간 디오라마를 팝 하고 등장
        this.el.sceneEl.addEventListener('xrimagefound', (e) => {
          const d = e.detail; if (!d || !NAMES.includes(d.name)) return;
          playEntrance();
        });
      }
    });
    AFRAME.registerComponent('chroma-video', {
      schema: { video:{type:'selector'}, color:{type:'color',default:'#00ff00'},
                similarity:{default:0.35}, smoothness:{default:0.08} },
      init: function () {
        const tex = new THREE.VideoTexture(this.data.video);
        tex.colorSpace = THREE.SRGBColorSpace;
        const key = new THREE.Color(this.data.color);
        const mat = new THREE.ShaderMaterial({
          transparent: true,
          side: THREE.DoubleSide,          // 회전해서 뒤를 보여도 안 사라지게

          uniforms: { map:{value:tex}, keyColor:{value:new THREE.Vector3(key.r,key.g,key.b)},
                      similarity:{value:this.data.similarity}, smoothness:{value:this.data.smoothness} },
          vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
          fragmentShader: 'uniform sampler2D map; uniform vec3 keyColor; uniform float similarity; uniform float smoothness; varying vec2 vUv;'+
            'void main(){ vec4 c=texture2D(map,vUv); float d=distance(c.rgb,keyColor);'+
            'float a=smoothstep(similarity,similarity+smoothness,d); if(a<0.05) discard; gl_FragColor=vec4(c.rgb,a); }'
        });
        const apply = () => { const m=this.el.getObject3D('mesh'); if (m) m.material = mat; };
        this.el.getObject3D('mesh') ? apply() : this.el.addEventListener('object3dset', apply);
      }
    });
    AFRAME.registerComponent('face-camera', {
      tick: function () {
        const cam = this.el.sceneEl.camera; if (!cam) return;
        const p = new THREE.Vector3(); cam.getWorldPosition(p);
        p.y = this.el.object3D.getWorldPosition(new THREE.Vector3()).y;
        this.el.object3D.lookAt(p);
      }
    });
    // 디오라마 모션: 등장 팝(0→1 overshoot) + 카드 법선 기준 회전 + 위아래 부유.
    // 세 겹을 한 엔티티에서 관리하며, play() 를 받기 전엔 scale 0(숨김) 상태로 대기한다.
    // → 마커를 처음 잡거나 페이지를 넘길 때 play()가 불려 "팝" 하고 등장한다.
    const easeOutBack = (p) => { const c1=1.70158, c3=c1+1; const x=p-1; return 1 + c3*x*x*x + c1*x*x; };
    AFRAME.registerComponent('diorama-motion', {
      schema: { spinMs:{default:9000}, doSpin:{default:true},
                bob:{default:0.02}, bobMs:{default:3200}, enterMs:{default:620} },
      init: function () { this.playing=false; this.start=null; this.el.object3D.scale.set(1e-4,1e-4,1e-4); },
      play2: function () { this.playing=true; this.start=null; },   // 등장 재생/재시작
      tick: function (time) {
        if (!this.playing) return;
        if (this.start == null) this.start = time;
        const e = time - this.start, o = this.el.object3D;
        const p = this.data.enterMs > 0 ? Math.min(1, e / this.data.enterMs) : 1;
        const s = p >= 1 ? 1 : easeOutBack(p);
        o.scale.set(s, s, s);
        if (this.data.doSpin) o.rotation.z = (e / this.data.spinMs) * Math.PI * 2;
        o.position.z = this.data.bob * (1 - Math.cos((e / this.data.bobMs) * Math.PI * 2)) / 2;
      }
    });
    // 현재 씬의 디오라마를 "팝" 하고 등장시킨다 (컴포넌트 초기화 전이면 loaded 후에).
    function playEntrance() {
      const d = document.querySelector('[diorama-motion]'); if (!d) return;
      const go = () => { const c = d.components && d.components['diorama-motion']; if (c) c.play2(); };
      (d.components && d.components['diorama-motion']) ? go() : d.addEventListener('loaded', go, {once:true});
    }

    // ─────────────────────────────────────────────────────────────
    // 광택 풍선 3D 오브젝트 (로고: 하트·세모·네모·Z) — 코드로 생성.
    // 사진 대신 재료가 없어, 이미지 속 모양을 three.js 지오메트리로 재현한다.
    // (완전 포토리얼 풍선은 아니고 스타일라이즈 버전. 추후 Spline GLB로 교체 가능)
    // ─────────────────────────────────────────────────────────────
    function puffyGeom(shape, depth, bevel) {
      const g = new THREE.ExtrudeGeometry(shape, {
        depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel,
        bevelSegments: 6, steps: 1, curveSegments: 24
      });
      g.center();
      return g;
    }
    function roundedRectShape(w, h, r) {
      const s = new THREE.Shape(), x = -w/2, y = -h/2;
      s.moveTo(x+r, y);
      s.lineTo(x+w-r, y); s.quadraticCurveTo(x+w, y, x+w, y+r);
      s.lineTo(x+w, y+h-r); s.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      s.lineTo(x+r, y+h); s.quadraticCurveTo(x, y+h, x, y+h-r);
      s.lineTo(x, y+r); s.quadraticCurveTo(x, y, x+r, y);
      return s;
    }
    function roundedPolyShape(pts, r) {
      const s = new THREE.Shape(), n = pts.length;
      for (let i=0;i<n;i++){
        const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n];
        const v1=p1.clone().sub(p0).normalize(), v2=p2.clone().sub(p1).normalize();
        const a=p1.clone().sub(v1.multiplyScalar(r)), b=p1.clone().add(v2.multiplyScalar(r));
        i===0 ? s.moveTo(a.x,a.y) : s.lineTo(a.x,a.y);
        s.quadraticCurveTo(p1.x, p1.y, b.x, b.y);
      }
      s.closePath();
      return s;
    }
    function heartShape() {
      const s = new THREE.Shape();
      s.moveTo(0, 0.3);
      s.bezierCurveTo(0, 0.45, -0.2, 0.75, -0.5, 0.75);
      s.bezierCurveTo(-0.9, 0.75, -0.9, 0.25, -0.9, 0.25);
      s.bezierCurveTo(-0.9, 0.0, -0.6, -0.3, 0, -0.7);
      s.bezierCurveTo(0.6, -0.3, 0.9, 0.0, 0.9, 0.25);
      s.bezierCurveTo(0.9, 0.25, 0.9, 0.75, 0.5, 0.75);
      s.bezierCurveTo(0.2, 0.75, 0, 0.45, 0, 0.3);
      return s;
    }
    function triShape() {
      const pts = [];
      for (let i=0;i<3;i++){ const a = Math.PI/2 + i*2*Math.PI/3; pts.push(new THREE.Vector2(Math.cos(a)*0.62, Math.sin(a)*0.62)); }
      return roundedPolyShape(pts, 0.2);
    }
    function squareHoleShape() {
      const s = roundedRectShape(1.0, 1.0, 0.28);
      const hole = new THREE.Path();
      hole.absellipse(0, -0.12, 0.2, 0.1, 0, Math.PI*2);
      s.holes.push(hole);
      return s;
    }
    AFRAME.registerComponent('balloon', {
      schema: { shape:{default:'heart'}, color:{type:'color', default:'#ec4d9b'}, size:{default:0.15} },
      init: function () {
        const mat = new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(this.data.color), metalness: 0.0, roughness: 0.12,
          clearcoat: 1.0, clearcoatRoughness: 0.12, envMapIntensity: 1.3, reflectivity: 0.6
        });
        const g = new THREE.Group(), sh = this.data.shape;
        if (sh === 'tri')         g.add(new THREE.Mesh(puffyGeom(triShape(), 0.5, 0.2), mat));
        else if (sh === 'square') g.add(new THREE.Mesh(puffyGeom(squareHoleShape(), 0.5, 0.2), mat));
        else if (sh === 'z') {
          const bar = (w,h) => puffyGeom(roundedRectShape(w,h,Math.min(w,h)*0.45), 0.5, 0.16);
          const top = new THREE.Mesh(bar(1.0,0.34), mat); top.position.y = 0.5;
          const bot = new THREE.Mesh(bar(1.0,0.34), mat); bot.position.y = -0.5;
          const dg  = new THREE.Mesh(bar(1.25,0.32), mat); dg.rotation.z = -0.92;
          g.add(top, bot, dg);
        } else g.add(new THREE.Mesh(puffyGeom(heartShape(), 0.5, 0.22), mat));
        // 최대 치수를 size 로 정규화 + 중심 맞춤
        const s0 = new THREE.Vector3(); new THREE.Box3().setFromObject(g).getSize(s0);
        g.scale.multiplyScalar(this.data.size / (Math.max(s0.x, s0.y, s0.z) || 1));
        const c = new THREE.Vector3(); new THREE.Box3().setFromObject(g).getCenter(c); g.position.sub(c);
        this.el.setObject3D('mesh', g);
      }
    });
    // 개별 부유 + 느린 자전 (오브젝트마다 phase 를 달리해 따로 논다)
    AFRAME.registerComponent('float3d', {
      schema: { bob:{default:0.015}, bobMs:{default:2600}, spinMs:{default:12000}, phase:{default:0} },
      init: function () { this.y0 = this.el.object3D.position.y; },
      tick: function (time) {
        const o = this.el.object3D, t = time + this.data.phase;
        o.position.y = this.y0 + this.data.bob * Math.sin(t / this.data.bobMs * Math.PI * 2);
        o.rotation.y = (t / this.data.spinMs) * Math.PI * 2;
      }
    });
    // 간이 스튜디오 환경광 — 유리질(clearcoat) 반사가 살아나도록 scene.environment 주입
    AFRAME.registerComponent('studio-env', {
      init: function () {
        const setup = () => {
          const r = this.el.renderer; if (!r || this.el.object3D.environment) return;
          const cv = document.createElement('canvas'); cv.width = 16; cv.height = 128;
          const g = cv.getContext('2d'), grad = g.createLinearGradient(0,0,0,128);
          grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, '#e2e6f7'); grad.addColorStop(1, '#9aa0c8');
          g.fillStyle = grad; g.fillRect(0,0,16,128);
          const tex = new THREE.CanvasTexture(cv); tex.mapping = THREE.EquirectangularReflectionMapping;
          const pmrem = new THREE.PMREMGenerator(r);
          this.el.object3D.environment = pmrem.fromEquirectangular(tex).texture;
          tex.dispose(); pmrem.dispose();
        };
        this.el.renderer ? setup() : this.el.addEventListener('loaded', setup, {once:true});
      }
    });

    // ---- 미디어(영상/사진) 로드 → 게이트 준비 ----
    // 한 카드(token)에 여러 장이 붙어 있을 수 있다 → items[] 로 받아 페이지로 넘김
    const mediaBox = document.getElementById('media');
    const gt = document.getElementById('gt'), gs = document.getElementById('gs');
    let ready = false, items = [], idx = 0;

    const cur = () => items[idx] || { kind: 'video' };
    const el = (i) => document.getElementById('m' + i);      // i번째 미디어 엘리먼트
    const SELof = (i) => '#m' + i;

    function buildMediaEls() {
      mediaBox.innerHTML = items.map((it, i) => it.kind === 'image'
        ? `<img id="m${i}" crossorigin="anonymous" alt="">`
        : `<video id="m${i}" muted playsinline crossorigin="anonymous" loop></video>`
      ).join('');
      items.forEach((it, i) => { el(i).src = it.url; });      // src는 엘리먼트 생성 뒤에
    }

    let tries = 0;
    const MAX_TRIES = 40;            // 2.5초 × 40 ≈ 100초 동안 자동 대기
    async function loadClip() {
      if (!token) { gt.textContent = 'QR이 올바르지 않아요'; gs.textContent = '카드의 QR을 다시 스캔해 주세요'; stopSpin(); return; }
      try {
        const r = await fetch('/api/clip?t=' + token, { cache: 'no-store' });
        if (!r.ok) throw 0;
        const j = await r.json();
        items = j.items && j.items.length ? j.items : [{ url: j.url, kind: j.kind || 'video' }];
        buildMediaEls();
        ready = true; stopSpin();
        gt.textContent = '탭하여 AR 시작';
        gs.innerHTML = '카메라 · 동작 권한을 허용한 뒤<br>받으신 카드에 비춰주세요'
                     + (items.length > 1 ? '<br><b>' + items.length + '장</b> — 아래 ‹ › 로 넘겨보세요' : '');
      } catch (e) {
        tries++;
        if (tries < MAX_TRIES) {
          // 부스에서 아직 영상이 안 올라왔을 수 있다 → 올라오는 순간 자동으로 이어지도록 재시도
          gt.textContent = '부스에서 준비 중…';
          gs.innerHTML = '촬영이 끝나면 자동으로 이어져요. 잠시만요 🙂<br>(' + token + ')';
          setTimeout(loadClip, 2500);
        } else {
          stopSpin();
          gt.textContent = '아직 준비되지 않았어요';
          gs.innerHTML = '부스에서 촬영이 끝나면 이 QR로 볼 수 있어요.<br>잠시 후 새로고침해 주세요 (' + token + ')';
        }
      }
    }
    function stopSpin(){ document.getElementById('gspin').style.display='none'; document.getElementById('gicon').style.display='block'; }
    loadClip();

    // ---- 소리 (현재 페이지가 영상일 때만) ----
    let soundOn = false;
    const bSnd = document.getElementById('bSnd');
    function applySound(){
      const m = el(idx);
      if (!m || cur().kind === 'image') return;
      m.muted = !soundOn; if (soundOn) m.play().catch(()=>{});
      bSnd.textContent = soundOn ? '🔊' : '🔇';
    }
    bSnd.addEventListener('click', (ev)=>{ ev.stopPropagation(); soundOn=!soundOn; applySound(); });

    // ---- 페이지 넘김 ----
    function goTo(n) {
      if (!items.length) return;
      idx = (n + items.length) % items.length;
      items.forEach((it, i) => { if (it.kind !== 'image' && i !== idx) el(i).pause(); });
      const m = el(idx);
      if (cur().kind !== 'image') { m.muted = !soundOn; m.currentTime = 0; m.play().catch(()=>{}); }
      renderItem();
      updateBar();
    }
    document.getElementById('bPrev').addEventListener('click', (ev)=>{ ev.stopPropagation(); goTo(idx-1); });
    document.getElementById('bNext').addEventListener('click', (ev)=>{ ev.stopPropagation(); goTo(idx+1); });
    function updateBar() {
      const multi = items.length > 1;
      document.getElementById('bPage').textContent = (idx+1) + ' / ' + items.length;
      document.getElementById('bPrev').style.display = multi ? '' : 'none';
      document.getElementById('bPage').style.display = multi ? '' : 'none';
      document.getElementById('bNext').style.display = multi ? '' : 'none';
      bSnd.style.display = cur().kind !== 'image' ? '' : 'none';
      bSnd.textContent = soundOn ? '🔊' : '🔇';
    }

    // ---- 씬 ----
    // contentHTML(): 현재 페이지 한 장의 내용. 페이지를 넘기면 이것만 다시 그린다.
    function contentHTML() {
      const kind = cur().kind, m = el(idx);
      const mw = (kind === 'image' ? m.naturalWidth  : m.videoWidth)  || 540;
      const mh = (kind === 'image' ? m.naturalHeight : m.videoHeight) || 960;
      const SEL = SELof(idx);
      const W = 0.62, H = +(W * mh / mw).toFixed(3);
      const spin = SPIN
        ? ` animation="property: rotation; from: 0 0 0; to: 0 0 360; dur: ${SPIN_MS}; loop: true; easing: linear"`
        : '';
      // 표현 방식은 그 장의 종류가 정한다:
      //   chroma(누끼) → k = 액자 없이 피사체만 수직으로 세움
      //   그 외        → FX 파라미터 (기본 s = 액자에 넣어 수직으로 세움)
      const MODE = kind === 'chroma' ? 'k' : ((kind === 'image' && FX === 'c') ? 's' : FX);

      let content;
      if (MODE === 'a') {
        // 액자: 카드에 눕혀서(카드와 평행) 재생
        content =
          `<a-box position="0 0.303 0.07" width="1.04" height="0.07" depth="0.14" material="color:#e8c98a;metalness:0.4;roughness:0.4"></a-box>
           <a-box position="0 -0.303 0.07" width="1.04" height="0.07" depth="0.14" material="color:#e8c98a;metalness:0.4;roughness:0.4"></a-box>
           <a-box position="-0.485 0 0.07" width="0.07" height="0.54" depth="0.14" material="color:#d2af6e;metalness:0.4;roughness:0.4"></a-box>
           <a-box position="0.485 0 0.07" width="0.07" height="0.54" depth="0.14" material="color:#d2af6e;metalness:0.4;roughness:0.4"></a-box>
           <a-plane material="src:${SEL}; shader:flat" width="0.9" height="0.506" position="0 0 0.01"></a-plane>`;
      } else if (MODE === 'k') {
        // 누끼(기본): 그린스크린을 지우고 피사체만 카드 위에 수직으로 세워 회전
        // 액자를 씌우면 누끼의 의미가 없으므로 프레임 없이 피사체만
        content =
          `<a-plane material="color:#000; opacity:0.22; transparent:true; shader:flat"
                    geometry="primitive:circle; radius:${(W * 0.4).toFixed(3)}" position="0 0 0.004"></a-plane>
           <a-entity${spin}>
             <a-entity position="0 0 ${(H / 2).toFixed(3)}" rotation="90 0 0">
               <a-plane chroma-video="video:${SEL}; color:${KEY}" width="${W}" height="${H}"></a-plane>
             </a-entity>
           </a-entity>`;
      } else if (MODE === 'c') {
        // 누끼(구): 그린스크린 제거 + 항상 카메라 바라보기 (?fx=c 로만 사용)
        content =
          `<a-plane material="color:#111; opacity:0.3; transparent:true" geometry="primitive:circle; radius:0.28" position="0 -0.1 0.02"></a-plane>
           <a-entity position="0 0 0.45" face-camera>
             <a-plane chroma-video="video:${SEL}; color:${KEY}" width="${W}" height="${H}"></a-plane>
           </a-entity>`;
      } else {
        // 기본(s): 카드 위에 액자로 수직으로 세우고, 등장 팝 + 회전 + 부유(diorama-motion).
        const B = 0.028, D = 0.02;               // 테두리 두께 / 액자 두께
        const lift = +(H / 2 + B).toFixed(3);    // 액자 밑변이 카드면에 딱 닿게
        const mot = `diorama-motion="spinMs:${SPIN_MS}; doSpin:${SPIN}; bob:${BOB}; bobMs:${BOB_MS}; enterMs:${ENTER_MS}"`;
        // 프레임 옆에 뜨는 로고 풍선 4종 (?obj=0 이면 끔)
        const objs = (q.get('obj') !== '0') ? (
          `<a-entity balloon="shape:heart;  color:#ec4d9b" position="${(W/2+0.15).toFixed(3)} ${(H/2-0.02).toFixed(3)} 0.03" float3d="phase:0"></a-entity>` +
          `<a-entity balloon="shape:tri;    color:#7b6ef0" position="${(-(W/2+0.15)).toFixed(3)} ${(H/2+0.03).toFixed(3)} 0.0" float3d="phase:700"></a-entity>` +
          `<a-entity balloon="shape:square; color:#7b6ef0" position="${(W/2+0.14).toFixed(3)} ${(-(H/2)+0.14).toFixed(3)} 0.0" float3d="phase:1500"></a-entity>` +
          `<a-entity balloon="shape:z;      color:#7b6ef0" position="${(-(W/2+0.16)).toFixed(3)} ${(-(H/2)+0.2).toFixed(3)} 0.0" float3d="phase:2300"></a-entity>`
        ) : '';
        content =
          `<a-plane material="color:#000; opacity:0.25; transparent:true; shader:flat"
                    geometry="primitive:circle; radius:${(W * 0.55).toFixed(3)}" position="0 0 0.004"></a-plane>
           <a-entity ${mot}>
             <a-entity position="0 0 ${lift}" rotation="90 0 0">
               ${buildFrame('proc', W, H, B, D, SEL)}
               ${objs}
             </a-entity>
           </a-entity>`;
      }
      return content;
    }

    // 액자 한 조각 — 나중에 GLB로 갈아껴도 나머지(사진·모션)는 안 건드리도록 분리.
    //   kind='proc' : 코드로 짠 이중베벨 + 모서리 장식 액자
    //   (kind='glb' : 추후 a-gltf-model 로 교체 예정)
    // 로컬 좌표: 이 엔티티는 이미 "세워진" 상태(부모가 rotation 90). +z가 앞면.
    function buildFrame(kind, W, H, B, D, SEL) {
      const face = +(D / 2 + 0.002).toFixed(3);
      const dark = '#d2af6e';                    // 안쪽 베벨(어두운 금)
      const oW = (W + B * 2).toFixed(3), oH = (H + B * 2).toFixed(3);
      const mW = (W + B * 0.9).toFixed(3), mH = (H + B * 0.9).toFixed(3);
      // 모서리 장식(금속 구) 4개 — 바깥 모서리에 박힌 스터드
      const cx = (W / 2 + B * 0.6).toFixed(3), cy = (H / 2 + B * 0.6).toFixed(3), cz = (D * 0.7).toFixed(3);
      const stud = (x, y) =>
        `<a-sphere radius="${(B * 0.7).toFixed(3)}" position="${x} ${y} ${cz}"
                   material="color:${GOLD}; metalness:0.7; roughness:0.25"></a-sphere>`;
      return (
        // 바깥 액자(밝은 금) = 테두리 + 뒤판(뚫려 보이지 않게)
        `<a-box width="${oW}" height="${oH}" depth="${D}"
                material="color:${GOLD}; metalness:0.45; roughness:0.35"></a-box>` +
        // 안쪽 베벨(어두운 금) — 사진 둘레에 살짝 들어간 매트
        `<a-box width="${mW}" height="${mH}" depth="${(D * 0.6).toFixed(3)}" position="0 0 ${(D * 0.25).toFixed(3)}"
                material="color:${dark}; metalness:0.5; roughness:0.4"></a-box>` +
        // 사진(앞/뒤 양면)
        `<a-plane width="${W}" height="${H}" position="0 0 ${face}" material="src:${SEL}; shader:flat"></a-plane>` +
        `<a-plane width="${W}" height="${H}" position="0 0 ${-face}" rotation="0 180 0" material="src:${SEL}; shader:flat"></a-plane>` +
        stud(cx, cy) + stud('-' + cx, cy) + stud(cx, '-' + cy) + stud('-' + cx, '-' + cy)
      );
    }

    // 씬 껍데기는 한 번만 만든다 (마커 추적 유지) — 페이지 넘김은 #anchor 안쪽만 교체
    function sceneHTML() {
      const xrweb = NOSLAM ? 'xrweb="disableWorldTracking: true"' : 'xrweb';
      return `<a-scene xrextras-gesture-detector xrextras-loading xrextras-runtime-error xrextras-almost-there
        studio-env renderer="colorManagement:true; physicallyCorrectLights:true" ${xrweb}>
        <a-camera position="0 4 10"></a-camera>
        <a-light type="directional" intensity="0.7" position="1 2 2"></a-light>
        <a-light type="ambient" intensity="0.9"></a-light>
        <a-entity id="anchor" persist-any-target>${contentHTML()}</a-entity>
      </a-scene>`;
    }

    function renderItem() {
      const a = document.getElementById('anchor');
      if (a) { a.innerHTML = contentHTML(); playEntrance(); }   // 페이지 넘길 때도 팝 하고 등장
    }

    function onXrError(e) {
      if (!NOSLAM) { const u = new URL(location.href); u.searchParams.set('noslam','1'); location.replace(u); return; }
      const box = document.getElementById('err');
      box.style.display = 'block';
      box.textContent = 'AR 엔진 오류 — 안드로이드: Chrome / 아이폰: Safari 로 열어주세요. ' + JSON.stringify((e&&e.detail)||'');
    }

    // i번째 미디어 크기(가로세로)가 잡힐 때까지 대기 — 액자 비율 계산에 필요
    function mediaReady(i) {
      const m = el(i);
      if (!m) return Promise.resolve();
      if (items[i].kind === 'image') {
        if (m.naturalWidth) return Promise.resolve();
        return new Promise(r => { m.addEventListener('load', r, {once:true});
          m.addEventListener('error', r, {once:true}); setTimeout(r, 4000); });
      }
      if (m.videoWidth) return Promise.resolve();
      return new Promise(r => { m.addEventListener('loadedmetadata', r, {once:true}); setTimeout(r, 4000); });
    }

    let started = false;
    document.getElementById('gate').addEventListener('click', async () => {
      if (started || IN_APP || !ready) return; started = true;
      // 첫 탭(사용자 제스처) 안에서 영상 재생을 걸어둬야 iOS가 허용해준다
      if (cur().kind !== 'image') {
        const m = el(idx);
        try { m.muted = false; await m.play(); soundOn = true; }
        catch (e) { m.muted = true; m.play().catch(()=>{}); soundOn = false; }
      }
      try {
        if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function')
          await DeviceMotionEvent.requestPermission();
      } catch (e) {}
      // 페이지를 넘겨도 액자 비율이 바로 잡히도록 모든 장의 크기를 먼저 확보
      await Promise.all(items.map((_, i) => mediaReady(i)));
      document.getElementById('gate').style.display = 'none';
      document.body.insertAdjacentHTML('beforeend', sceneHTML());
      const scene = document.querySelector('a-scene');
      scene.addEventListener('xrerror', onXrError);
      document.getElementById('bar').style.display = 'flex';
      updateBar();
      applySound();
    });
  </script>
</body>
</html>
