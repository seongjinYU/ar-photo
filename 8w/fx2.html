  <style>
    html, body { margin:0; height:100%; background:#fdf8f1; overflow:hidden;
      font-family:-apple-system,"Apple SD Gothic Neo",sans-serif; color:#17171b; }
    /* 성락네컷 파스텔 게이트 — 아이보리 바탕 + 흐린 파스텔 블롭(핑크·노랑·하늘) */
    .full { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px;
      background:
        radial-gradient(42% 34% at 10% 10%, rgba(255,183,219,.75) 0%, rgba(255,183,219,0) 70%),
        radial-gradient(40% 32% at 90% 88%, rgba(167,209,255,.8) 0%, rgba(167,209,255,0) 70%),

        linear-gradient(180deg, #ffffff 0%, #fdf6ec 100%); }
    /* 배경 장식 — 로고 도형을 또렷하게 모서리에 살짝 걸침 (레퍼런스 하단 도형 느낌) */
    .deco { position:absolute; width:30vw; max-width:170px; opacity:.5; pointer-events:none; }
    .deco.tl { top:-9vw; right:-8vw; left:auto; transform:rotate(14deg); }
    .deco.br { bottom:-9vw; left:-8vw; right:auto; transform:rotate(-12deg); }
    /* 스티커 타이틀 — 흰 라운드 카드 + 두꺼운 검정 테두리, 살짝 기울여 겹침 */
    .stickers { display:flex; flex-direction:column; align-items:center; margin-bottom:2px; }
    .sticker { background:#fff; border:4px solid #141418; border-radius:16px; padding:7px 20px;
      font-weight:900; color:#141418; box-shadow:0 3px 0 rgba(20,20,24,.9); }
    .sticker.small { font-size:14.5px; letter-spacing:1.5px; transform:rotate(-2.5deg); z-index:1; }
    .sticker.big { font-size:34px; letter-spacing:2px; padding:10px 26px; transform:rotate(1.6deg);
      margin-top:-6px; border-radius:20px; }
    .logo42 { width:96px; margin:10px 0 2px; animation:breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .t { font-size:24px; font-weight:800; color:#17171b; }
    .s { font-size:15.5px; font-weight:600; color:#6d6d78; line-height:1.65; }
    .s b, .s .accent { color:#f14fa4; }
    .spin { width:40px; height:40px; border-radius:50%; border:3px solid rgba(91,79,245,.22);
      border-top-color:#5b4ff5; animation:sp .9s linear infinite; }
    /* 하단 재생 가이드 — 흰 필 카드 */
    .guide { position:absolute; left:50%; transform:translateX(-50%); bottom:max(env(safe-area-inset-bottom),24px);
      background:rgba(255,255,255,.92); border-radius:20px; padding:14px 22px; text-align:left;
      box-shadow:0 6px 24px rgba(80,60,140,.14); backdrop-filter:blur(6px); white-space:nowrap; }
    .guide .gh { font-weight:900; font-size:14px; color:#5b4ff5; letter-spacing:1px; margin-bottom:8px; }
    .guide .gstep { font-size:14.5px; font-weight:700; color:#26262e; line-height:1.95; }
    .guide .gstep b { display:inline-block; width:21px; height:21px; line-height:21px; text-align:center;
      background:#5b4ff5; color:#fff; border-radius:50%; font-size:11.5px; font-weight:800; margin-right:8px; }
    @keyframes sp { to { transform:rotate(360deg); } }
    #bar { position:fixed; left:0; right:0; bottom:max(env(safe-area-inset-bottom),14px);
      display:none; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; z-index:50; padding:0 12px; }
    #bar .pill { display:flex; align-items:center; gap:9px; padding:9px 14px; border-radius:999px;
      background:rgba(20,24,44,0.72); backdrop-filter:blur(8px); }
    #bar label { font-size:12.5px; font-weight:800; color:#e8c98a; }
    #bar input[type=range] { width:min(38vw,180px); }
    #bar button { padding:10px 13px; border:none; border-radius:999px; font-size:13.5px; font-weight:800;
      background:rgba(255,255,255,0.14); color:#fff; backdrop-filter:blur(8px); }
    #bar button.on { background:#e8c98a; color:#1a1405; }
    #err { position:fixed; left:12px; right:12px; top:max(env(safe-area-inset-top),12px); z-index:150;
      display:none; background:rgba(160,40,40,.92); border-radius:12px; padding:12px 14px;
      font-size:12.5px; line-height:1.5; word-break:break-all; }

<body>

  <!-- Android Chrome은 display:none 비디오를 디코딩하지 않아 텍스처가 검게 남음.
       화면 밖 2px로 '렌더는 되되 안 보이게' 유지해야 안드로이드에서도 프레임이 나옴. -->
  <div id="media" style="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:60;overflow:hidden"></div>

  <script>
    // ================= 옵션 =================
    const q = new URLSearchParams(location.search);
    const token = (location.pathname.match(/\/(?:v|fx)\/([a-z0-9-]{3,24})/i) || [,''])[1].toLowerCase()
                || q.get('t') || 'demo01';
    let W    = +(q.get('w') || 1.0);
    let GAP  = +(q.get('depth') || 0.05);       // 프레임 깊이(고정 5) — 풍선은 GAP+0.05=10. 슬라이더 없앰
    let LIFT = +(q.get('lift') || 0.16);        // 카드와의 간격(띄우기)
    let orient = (q.get('orient') === 'h') ? 'h' : 'v';   // 기본 수직(v) / ?orient=h 로 수평
    let showSpark = q.get('spark') !== '0';
    const PN    = Math.min(160, +(q.get('pn') || 80));
    const PSIZE = +(q.get('psize') || 45);
    const SPARK = '#' + (q.get('sparkcol') || 'fff2cf');
    const FRAME = q.get('frame') || '/8w/assets/f3_keepers_purple.png';
    const PREVIEW = q.get('preview')==='1';   // 데스크톱 미리보기: 카메라/마커 없이 fx2 씬 그대로
    const MEDIA = q.get('media') || '';        // 미리보기용 직접 미디어 URL(예: demo01.mp4). 없으면 /api/clip
    const BSIZE = +(q.get('bsize') || 0.60);          // 풍선 크기(최대 변)
    const BSPIN = q.get('bspin')==='1' ? 1 : 0;        // 풍선 자전 (기본 off)
    let userScale = +(q.get('scale') || 1);            // 사진 크기(핀치/휠로 조절)
    const BG = q.get('bg') || 'ffffff';                // 프리뷰 뒷배경 색 (기본 흰색)
    const SHOWFX = q.get('fx') !== '0';                 // fx-lab 이식 이펙트(버블+오빗링) 표시 (기본 on, ?fx=0 으로 끔)
    const INTRO = q.get('intro') !== '0';               // 등장 연출 시퀀스 (기본 on, ?intro=0 으로 즉시 표시)
    const IA = +(q.get('ia') || 1200);                  // 연출: 합체 시간(ms)
    const IR = +(q.get('ir') || 2700);                  // 연출: 회전 기상 시간(ms)
    const IV = +(q.get('iv') || 1500);                  // 연출: 링·버블 등장 시간(ms)

    const UA = navigator.userAgent;
    const IN_APP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|; wv\)/i.test(UA);
    const NOSLAM = /[?&]noslam=1/.test(location.search);
    if (IN_APP) { document.getElementById('gate').style.display='none'; document.getElementById('inapp').style.display='flex'; }

    // ================= 마커(카드) 타깃 =================
    const imageTargetData = [
      {"type":"PLANAR","properties":{"top":0,"left":0,"width":900,"height":900,"isRotated":false,"originalWidth":900,"originalHeight":900},"imagePath":"/8w/image-targets/fused_luminance.jpg","metadata":null,"name":"fused","resources":{"originalImage":"fused_original.jpg","croppedImage":"fused_cropped.jpg","thumbnailImage":"fused_thumbnail.jpg","luminanceImage":"fused_luminance.jpg"},"created":1777000000000,"updated":1777000000000},
      {"type":"PLANAR","properties":{"top":0,"left":0,"width":900,"height":1180,"isRotated":false,"originalWidth":900,"originalHeight":1180},"imagePath":"/8w/image-targets/card1_luminance.jpg","metadata":null,"name":"card1","resources":{"originalImage":"card1_original.jpg","croppedImage":"card1_cropped.jpg","thumbnailImage":"card1_thumbnail.jpg","luminanceImage":"card1_luminance.jpg"},"created":1777000000000,"updated":1777000000000},
      {"type":"PLANAR","properties":{"top":0,"left":0,"width":900,"height":1180,"isRotated":false,"originalWidth":900,"originalHeight":1180},"imagePath":"/8w/image-targets/card2_luminance.jpg","metadata":null,"name":"card2","resources":{"originalImage":"card2_original.jpg","croppedImage":"card2_cropped.jpg","thumbnailImage":"card2_thumbnail.jpg","luminanceImage":"card2_luminance.jpg"},"created":1777000000000,"updated":1777000000000},
      {"type":"PLANAR","properties":{"top":0,"left":0,"width":900,"height":1180,"isRotated":false,"originalWidth":900,"originalHeight":1180},"imagePath":"/8w/image-targets/card3_luminance.jpg","metadata":null,"name":"card3","resources":{"originalImage":"card3_original.jpg","croppedImage":"card3_cropped.jpg","thumbnailImage":"card3_thumbnail.jpg","luminanceImage":"card3_luminance.jpg"},"created":1777000000000,"updated":1777000000000},
      {"type":"PLANAR","properties":{"top":0,"left":0,"width":900,"height":900,"isRotated":false,"originalWidth":900,"originalHeight":900},"imagePath":"/8w/image-targets/fxcard_luminance.jpg","metadata":null,"name":"fxcard","resources":{"originalImage":"fxcard_original.jpg","croppedImage":"fxcard_cropped.jpg","thumbnailImage":"fxcard_thumbnail.jpg","luminanceImage":"fxcard_luminance.jpg"},"created":1777000000000,"updated":1777000000000},
      {"type":"PLANAR","properties":{"top":0,"left":0,"width":806,"height":1200,"isRotated":false,"originalWidth":806,"originalHeight":1200},"imagePath":"/8w/image-targets/qrcard_luminance.jpg","metadata":null,"name":"qrcard","resources":{"originalImage":"qrcard_original.jpg","croppedImage":"qrcard_cropped.jpg","thumbnailImage":"qrcard_thumbnail.jpg","luminanceImage":"qrcard_luminance.jpg"},"created":1777000000000,"updated":1777000000000}
    ];
    const onxrloaded = () => { if(!PREVIEW) XR8.XrController.configure({ imageTargetData }); };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);

    const NAMES = ['fused','card1','card2','card3','fxcard','qrcard'];
    AFRAME.registerComponent('persist-any-target', {
      init: function () {
        const obj = this.el.object3D; obj.visible = false;
        const sync = (e) => {
          const d = e.detail; if (!d || !NAMES.includes(d.name)) return;
          if (d.position) obj.position.set(d.position.x, d.position.y, d.position.z);
          if (d.rotation) obj.quaternion.set(d.rotation.x, d.rotation.y, d.rotation.z, d.rotation.w);
          if (typeof d.scale === 'number') obj.scale.set(d.scale, d.scale, d.scale);
          obj.visible = true;
        };
        this.el.sceneEl.addEventListener('xrimagefound', sync);
        this.el.sceneEl.addEventListener('xrimageupdated', sync);
      }
    });

    // ================= 로고 풍선 (다른 세션 오브젝트 이식) =================
    function puffyGeom(shape, depth, bevel){
      const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel,bevelSegments:6,steps:1,curveSegments:24}); g.center(); return g; }
    function roundedRectShape(w,h,r){ const s=new THREE.Shape(),x=-w/2,y=-h/2;
      s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
      s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
      s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }
    function roundedPolyShape(pts,r){ const s=new THREE.Shape(),n=pts.length;
      for(let i=0;i<n;i++){ const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n];
        const v1=p1.clone().sub(p0).normalize(),v2=p2.clone().sub(p1).normalize();
        const a=p1.clone().sub(v1.multiplyScalar(r)),b=p1.clone().add(v2.multiplyScalar(r));
        i===0?s.moveTo(a.x,a.y):s.lineTo(a.x,a.y); s.quadraticCurveTo(p1.x,p1.y,b.x,b.y);} s.closePath(); return s; }
    function heartShape(){ const s=new THREE.Shape(); s.moveTo(0,0.3);
      s.bezierCurveTo(0,0.45,-0.2,0.75,-0.5,0.75); s.bezierCurveTo(-0.9,0.75,-0.9,0.25,-0.9,0.25);
      s.bezierCurveTo(-0.9,0.0,-0.6,-0.3,0,-0.7); s.bezierCurveTo(0.6,-0.3,0.9,0.0,0.9,0.25);
      s.bezierCurveTo(0.9,0.25,0.9,0.75,0.5,0.75); s.bezierCurveTo(0.2,0.75,0,0.45,0,0.3); return s; }
    function triShape(){ const pts=[]; for(let i=0;i<3;i++){ const a=Math.PI/2+i*2*Math.PI/3; pts.push(new THREE.Vector2(Math.cos(a)*0.62,Math.sin(a)*0.62)); } return roundedPolyShape(pts,0.2); }
    function squareHoleShape(){ const s=roundedRectShape(1.0,1.0,0.28); const hole=new THREE.Path(); hole.absellipse(0,-0.12,0.2,0.1,0,Math.PI*2); s.holes.push(hole); return s; }
    AFRAME.registerComponent('balloon',{
      schema:{shape:{default:'heart'},color:{type:'color',default:'#ec4d9b'},size:{default:0.15}},
      init:function(){
        const mat=new THREE.MeshPhysicalMaterial({color:new THREE.Color(this.data.color),metalness:0.0,roughness:0.12,clearcoat:1.0,clearcoatRoughness:0.12,envMapIntensity:1.3,reflectivity:0.6});
        const g=new THREE.Group(), sh=this.data.shape;
        if(sh==='tri') g.add(new THREE.Mesh(puffyGeom(triShape(),0.5,0.2),mat));
        else if(sh==='square') g.add(new THREE.Mesh(puffyGeom(squareHoleShape(),0.5,0.2),mat));
        else if(sh==='z'){ const bar=(w,h)=>puffyGeom(roundedRectShape(w,h,Math.min(w,h)*0.45),0.5,0.16);
          const top=new THREE.Mesh(bar(1.0,0.34),mat); top.position.y=0.5;
          const bot=new THREE.Mesh(bar(1.0,0.34),mat); bot.position.y=-0.5;
          const dg=new THREE.Mesh(bar(1.25,0.32),mat); dg.rotation.z=-0.92; g.add(top,bot,dg);
        } else g.add(new THREE.Mesh(puffyGeom(heartShape(),0.5,0.22),mat));
        const s0=new THREE.Vector3(); new THREE.Box3().setFromObject(g).getSize(s0);
        g.scale.multiplyScalar(this.data.size/(Math.max(s0.x,s0.y,s0.z)||1));
        const c=new THREE.Vector3(); new THREE.Box3().setFromObject(g).getCenter(c); g.position.sub(c);
        this.el.setObject3D('mesh',g);
      }
    });
    // GLB 풍선: 로드 후 최대 변을 size에 맞춰 정규화 + 원점 중심으로 이동
    // (float3d는 바깥 object3D를, 이 정규화는 안쪽 mesh를 다루므로 서로 간섭 없음)
    AFRAME.registerComponent('fit-size',{
      schema:{size:{default:0.26},flipx:{default:false},gloss:{default:0.02}},
      init:function(){ this.el.addEventListener('model-loaded',()=>{
        const m=this.el.getObject3D('mesh'); if(!m) return;
        const s=new THREE.Vector3(); new THREE.Box3().setFromObject(m).getSize(s);
        m.scale.multiplyScalar(this.data.size/(Math.max(s.x,s.y,s.z)||1));
        if(this.data.flipx) m.scale.x = -m.scale.x;   // 좌우 반전
        // 재중심: setFromObject 중심은 '월드' 좌표. 엔티티가 회전(setOrient)·이동된 뒤 model-loaded가 늦게 뜨면
        // 월드중심을 로컬 position에서 그대로 빼서 풍선이 가운데로 쏠림 → 월드중심을 엔티티 로컬로 변환 후 빼야 정확.
        this.el.object3D.updateWorldMatrix(true,false);
        const c=new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3());
        this.el.object3D.worldToLocal(c); m.position.sub(c);
        // 유광: 재질을 매끈하게(낮은 roughness) + 물리재질로 승격해 clearcoat(유광 코트) + studio-env 반사 강화
        const G=this.data.gloss;
        if(G>0) m.traverse(o=>{ if(o.isMesh&&o.material){
          const arr=Array.isArray(o.material)?o.material:[o.material];
          const up=arr.map(mt=>{
            let mat=mt;
            if(mt.isMeshStandardMaterial && !mt.isMeshPhysicalMaterial){ mat=new THREE.MeshPhysicalMaterial(); mat.copy(mt); }
            if('roughness' in mat) mat.roughness=G;
            if('envMapIntensity' in mat) mat.envMapIntensity=2.2;
            if('clearcoat' in mat){ mat.clearcoat=1.0; mat.clearcoatRoughness=0.03; }
            mat.needsUpdate=true; return mat;
          });
          o.material=Array.isArray(o.material)?up:up[0];
        } });
      }); }
    });
    AFRAME.registerComponent('float3d',{
      schema:{bob:{default:0.03},bobMs:{default:2600},spinMs:{default:11000},phase:{default:0},spin:{default:1}},
      init:function(){ this.y0=this.el.object3D.position.y; },
      tick:function(time){ const o=this.el.object3D,t=time+this.data.phase;
        o.position.y=this.y0+this.data.bob*Math.sin(t/this.data.bobMs*Math.PI*2);
        if(this.data.spin) o.rotation.y=(t/this.data.spinMs)*Math.PI*2; }   // spin:0 이면 자전 끔(방향 고정)
    });
    // 등장(아래에서 떠오름) + 부유. 'rise' 이벤트를 받으면 startY→제자리로 상승 후 부유.
    AFRAME.registerComponent('rise-float',{
      schema:{ toY:{default:0}, startY:{default:-1.1}, dur:{default:2000}, delay:{default:0}, bob:{default:0.03}, bobMs:{default:2600}, phase:{default:0} },
      init:function(){ this.t0=null; this.el.object3D.position.y=this.data.startY; },   // 즉시 아래에서 대기
      tick:function(time){ const o=this.el.object3D, d=this.data;
        if(this.el.__busy) return;   // 디플레이트(바람빠짐) 중엔 balloon-poke가 위치 전담 → 양보
        // 이벤트 대신 전역 플래그를 tick에서 폴링 → 리스너 등록 타이밍 레이스 없음(모든 풍선 동일 프레임에 t0 설정)
        if(this.t0===null){ if(window.__riseGo){ this.t0=time; } else { o.position.y=d.startY; return; } }
        const e=time - this.t0 - d.delay;
        if(e<=0){ o.position.y=d.startY; return; }
        if(e<d.dur){ const k=1-Math.pow(1-e/d.dur,3);                 // easeOutCubic 상승
          o.position.y=d.startY + (d.toY-d.startY)*k; return; }       // 목표 y는 명시값(캡처 안 함)
        o.position.y=d.toY + d.bob*Math.sin(time/d.bobMs*Math.PI*2 + d.phase/1000*Math.PI*2); }  // 도착 후 부유
    });
    // 풍선 탭 반응: 한두 번은 '툭' 눌림(스퀴시), threshold 이상이면 '바람빠짐'(크게 한두바퀴 화면 안팎 돈 뒤 제자리)
    AFRAME.registerComponent('balloon-poke',{
      schema:{ threshold:{default:3}, dur:{default:2600} },
      init:function(){ this.count=0; this.squishT0=null; this.deflT0=null;
        this.home=new THREE.Vector3(); this.baseRot=new THREE.Euler();
        this.el.addEventListener('poke',()=>this.onPoke()); },
      onPoke:function(){
        if(this.deflT0!==null) return;                 // 이미 바람빠짐 중이면 무시
        this.count++;
        if(this.count>=this.data.threshold){            // 바람빠짐 시작
          this.home.copy(this.el.object3D.position);
          const rf=this.el.components['rise-float']; if(rf) this.home.y=rf.data.toY;   // bob 제외 안착 높이
          this.baseRot.copy(this.el.object3D.rotation);
          this.el.__busy=true; this._deflGo=true;
          if(window.__playSfx) window.__playSfx('deflate',{gain:0.85, loopDur:this.data.dur/1000});  // 날아가는 소리 — 원음 반복으로 애니 길이 채움(음정 유지)
        } else { this._squishGo=true;                    // 툭 스퀴시
          if(window.__playSfx) window.__playSfx('bop',{gain:0.8}); }
      },
      tick:function(time){ const o=this.el.object3D;
        // 툭 스퀴시(스케일 눌림, 위치는 rise-float가 계속 담당)
        if(this._squishGo){ this.squishT0=time; this._squishGo=false; }
        if(this.squishT0!==null){ const e=(time-this.squishT0)/280;
          if(e>=1){ this.squishT0=null; o.scale.set(1,1,1); }
          else { const k=Math.sin(e*Math.PI); o.scale.set(1+0.22*k,1-0.28*k,1+0.22*k); } }
        // 바람빠짐: 큰 나선(2바퀴)으로 화면 밖까지 나갔다 제자리 복귀 + 텀블 회전
        if(this._deflGo){ this.deflT0=time; this._deflGo=false; }
        if(this.deflT0!==null){ const T=this.data.dur, e=(time-this.deflT0)/T;
          if(e>=1){ o.position.copy(this.home); o.rotation.copy(this.baseRot); o.scale.set(1,1,1);
            this.deflT0=null; this.count=0; this.el.__busy=false; }
          else { const env=Math.sin(Math.PI*e), ang=e*Math.PI*2*2, A=1.0, Az=0.5;
            o.position.set(this.home.x+A*env*Math.cos(ang), this.home.y+A*0.8*env*Math.sin(ang), this.home.z+Az*env*Math.sin(ang*0.5+0.4));
            o.rotation.set(this.baseRot.x+env*ang*0.5, this.baseRot.y+env*ang, this.baseRot.z+env*ang*0.7);

      }
    });

    // ===== 등장 연출 디렉터 =====
    // __introGo(마커 인식) 시: 눕힘 → 프레임+사진 좌우 슬라이드 합체 → 한바퀴 돌며 수직 기상(+포탈 확대·풍선 상승) → 링·버블 등장
    AFRAME.registerComponent('intro-director',{
      schema:{ assemble:{default:1200}, rise:{default:2700}, reveal:{default:1500}, slideX:{default:0.9} },
      init:function(){ this.t0=null; this.ready=false; this.setDone=false; this.done=false; this.riseGo=false; },
      grab:function(){
        this.stand=document.getElementById('stand'); this.video=document.getElementById('videoBack');
        this.frame=document.getElementById('frameFront'); this.portal=document.getElementById('portal');
        this.swirl=document.querySelector('[portal-swirl]'); this.ring=document.getElementById('fx-ring');
        this.sparks=document.getElementById('sparks'); this.bubbles=[...document.querySelectorAll('.bubble')];
        this.ready=!!(this.stand&&this.stand.object3D && this.video&&this.video.getObject3D('mesh') && this.frame&&this.frame.getObject3D('mesh'));
        return this.ready;
      },
      op:function(el,o){ if(!el) return; const m=el.getObject3D('mesh'); if(m&&m.material){ m.material.transparent=true; m.material.opacity=o; } },
      setInitial:function(){
        this.stand.object3D.rotation.set(0,0,0); this.stand.object3D.position.set(0,0,LIFT);   // 눕힘(수평)
        this.video.object3D.position.x=-this.data.slideX; this.frame.object3D.position.x=this.data.slideX;
        this.op(this.video,0); this.op(this.frame,0);
        if(this.portal&&this.portal.object3D) this.portal.object3D.scale.setScalar(0.0001);
        if(this.swirl&&this.swirl.object3D) this.swirl.object3D.visible=false;
        if(this.ring&&this.ring.object3D) this.ring.object3D.scale.setScalar(0.0001);
        if(this.sparks&&this.sparks.object3D) this.sparks.object3D.visible=false;
        this.bubbles.forEach(b=>{ if(b.object3D) b.object3D.scale.setScalar(0.0001); });
        this.setDone=true;
      },
      tick:function(time){
        if(this.done) return;
        if(!this.ready){ if(!this.grab()) return; }
        if(!this.setDone) this.setInitial();
        if(this.t0===null){ if(window.__introGo){ this.t0=time; } else return; }
        const t=time-this.t0, D=this.data, cl=x=>Math.max(0,Math.min(1,x)), ease=x=>1-Math.pow(1-cl(x),3);
        // P1 합체: 좌우 슬라이드 + 페이드인 (수평 상태)
        { const e=ease(t/D.assemble);
          this.video.object3D.position.x=-D.slideX*(1-e); this.frame.object3D.position.x=D.slideX*(1-e);
          this.op(this.video, cl(t/D.assemble)); this.op(this.frame, cl(t/D.assemble)); }
        // P2 한바퀴 돌며 수직 기상 (+포탈 확대, +반짝이, +풍선 상승)
        const t2=t-D.assemble;
        if(t2>0){ const e=ease(t2/D.rise);
          this.stand.object3D.rotation.set((Math.PI/2)*e, (Math.PI*2)*e, 0);
          this.stand.object3D.position.set(0,0, LIFT+(Hm/2)*e);
          const pe=ease((t2-D.rise*0.25)/(D.rise*0.75));
          if(this.portal&&this.portal.object3D) this.portal.object3D.scale.setScalar(Math.max(0.0001,pe));
          if(this.swirl&&this.swirl.object3D) this.swirl.object3D.visible=pe>0.05;
          if(this.sparks&&this.sparks.object3D) this.sparks.object3D.visible=showSpark && t2>D.rise*0.2;
          if(!this.riseGo && t2>D.rise*0.1){ window.__riseGo=true; this.riseGo=true; } }
        // P3 링 + 버블 등장 (합체·기상 후)
        const t3=t-D.assemble-D.rise;
        if(t3>0){ if(this.ring&&this.ring.object3D) this.ring.object3D.scale.setScalar(Math.max(0.0001,ease(t3/D.reveal)));
          this.bubbles.forEach((b,i)=>{ if(b.object3D) b.object3D.scale.setScalar(Math.max(0.0001,ease((t3-i*35)/D.reveal))); }); }
        if(t>D.assemble+D.rise+D.reveal+150) this.finish();
      },
      finish:function(){ this.done=true;
        this.stand.object3D.rotation.set(Math.PI/2,0,0); this.stand.object3D.position.set(0,0,LIFT+Hm/2);
        this.video.object3D.position.x=0; this.op(this.video,1);
        this.frame.object3D.position.x=0; this.op(this.frame,1);
        if(this.portal&&this.portal.object3D) this.portal.object3D.scale.setScalar(1);
        if(this.swirl&&this.swirl.object3D) this.swirl.object3D.visible=true;
        if(this.ring&&this.ring.object3D) this.ring.object3D.scale.setScalar(1);
        if(this.sparks&&this.sparks.object3D) this.sparks.object3D.visible=showSpark;
        this.bubbles.forEach(b=>{ if(b.object3D) b.object3D.scale.setScalar(1); });
      }
    });

    AFRAME.registerComponent('sparkles',{

      // preview: 앵커를 실제 AR처럼 '테이블에 눕힌 카드' 자세로(로컬 +Z=위). 안 그러면 사진/풍선 방향이 어긋남.
      const anchorAttr = PREVIEW ? 'rotation="-90 0 0"' : 'persist-any-target';
      return `<a-scene ${sceneAttrs}>
        <a-assets><img id="frame" src="${FRAME}" crossorigin="anonymous"></a-assets>
        ${camera}
        <a-light type="ambient" intensity="0.85"></a-light>
        <a-light type="directional" intensity="1.15" position="1.5 2 2.5"></a-light>
        <a-light type="directional" intensity="0.5" position="-2 1 -1"></a-light>
        <a-entity id="anchor" ${anchorAttr} ${INTRO ? ('intro-director="assemble:'+IA+'; rise:'+IR+'; reveal:'+IV+'"') : ''}>
          <a-entity id="sparks" sparkles="n:${PN}; psize:${PSIZE}; w:${(W*0.95).toFixed(2)}; h:${(Hm*1.15).toFixed(2)}; color:${SPARK}"></a-entity>
          <a-entity id="stand">
            <!-- 홀로그램 포탈 베이스: 사진 하단(사진 뒤), billboard로 카메라 향함 -->
            <a-entity id="portal" sprite-overlay="src:/8w/assets/fx/light-circle.png; blend:normal; billboard:false; w:${PORTALW}; h:${PORTALW}; opacity:0.95; spin:${PSPIN}" position="${PX.toFixed(3)} ${PY.toFixed(3)} -0.08"></a-entity>
            <!-- 포탈 회전 연출: 보라색 반짝이가 디스크 둘레를 타원으로 돌며 반짝 -->
            <a-entity portal-swirl="rx:${(PORTALW*0.36).toFixed(3)}; ry:${(PORTALW*0.12).toFixed(3)}; speed:0.55" position="${PX.toFixed(3)} ${(PY+0.02).toFixed(3)} -0.03"></a-entity>
            <!-- 사진 유닛(사진+프레임+풍선)을 살짝 띄움 → 포탈 위에 떠 있게 -->
            <a-entity id="floater" position="0 ${FLOAT.toFixed(3)} 0">
            <a-plane id="videoBack" material="src:#v; shader:flat; side:double" width="${W}" height="${Hm}" position="0 0 0"></a-plane>
            <a-plane id="frameFront" material="src:#frame; shader:flat; transparent:true; side:double" width="${W}" height="${Hm}" position="0 0 ${GAP.toFixed(3)}"></a-plane>
            <!-- loco GLB 4개. 왼위(1)·오른아래(4)=사진 앞(현 위치) / 오른위(2)·왼아래(3)=사진 뒤로 살짝. 전부 아래에서 등장 -->
            <a-entity class="balloon" balloon-poke gltf-model="url(/8w/assets/loco_1_balloon1.glb)" fit-size="size:${(BSIZE*W).toFixed(3)}" rotation="90 0 0" position="${bp(-(hw+0.16*W), hh+0.02*W)}" rise-float="toY:${(hh+0.02*W).toFixed(3)};  startY:${startY}; delay:0;   phase:0"></a-entity>
            <a-entity class="balloon" balloon-poke gltf-model="url(/8w/assets/loco_2_balloon1.glb)" fit-size="size:${(BSIZE*W).toFixed(3)}; flipx:true" rotation="90 0 0" position="${bpZ(hw+0.16*W, hh-0.12*W, behindZ)}" rise-float="toY:${(hh-0.12*W).toFixed(3)};  startY:${startY}; delay:250; phase:700"></a-entity>
            <a-entity class="balloon" balloon-poke gltf-model="url(/8w/assets/loco_3_balloon1.glb)" fit-size="size:${(BSIZE*W).toFixed(3)}" rotation="90 0 0" position="${bpZ(-(hw+0.18*W), -(hh-0.28*W), behindZ)}" rise-float="toY:${(-(hh-0.28*W)).toFixed(3)}; startY:${startY}; delay:500; phase:1500"></a-entity>
            <a-entity class="balloon" balloon-poke gltf-model="url(/8w/assets/loco_4_balloon1.glb)" fit-size="size:${(BSIZE*W).toFixed(3)}" rotation="90 0 0" position="${bp(hw+0.14*W,  -(hh-0.20*W))}" rise-float="toY:${(-(hh-0.20*W)).toFixed(3)}; startY:${startY}; delay:750; phase:2300"></a-entity>
            </a-entity><!-- /floater -->
            ${SHOWFX ? `
            <!-- fx-lab 이식: 홀로 버블 9개(크게, 넓게 흩뿌림, billboard로 카메라 향함) -->
            <a-entity class="bubble" sprite-overlay="src:/8w/assets/fx/bubble.png; blend:normal; billboard:true; w:0.44; h:0.66; bob:0.04;  bobMs:3400; phase:0;    opacity:0.95" position="-1.02 0.72 0.18"></a-entity>
            <a-entity class="bubble" sprite-overlay="src:/8w/assets/fx/bubble.png; blend:normal; billboard:true; w:0.34; h:0.51; bob:0.035; bobMs:2900; phase:900;  opacity:0.9"  position="1.05 0.42 -0.25"></a-entity>
            <a-entity class="bubble" sprite-overlay="src:/8w/assets/fx/bubble.png; blend:normal; billboard:true; w:0.30; h:0.45; bob:0.03;  bobMs:2500; phase:1700; opacity:0.9"  position="1.12 -0.55 0.26"></a-entity>
            <a-entity class="bubble" sprite-overlay="src:/8w/assets/fx/bubble.png; blend:normal; billboard:true; w:0.26; h:0.39; bob:0.028; bobMs:2200; phase:2600; opacity:0.88" position="-0.95 -0.5 -0.2"></a-entity>
            <a-entity class="bubble" sprite-overlay="src:/8w/assets/fx/bubble.png; blend:normal; billboard:true; w:0.22; h:0.33; bob:0.025; bobMs:2000; phase:3300; opacity:0.85" position="0.5 1.15 0.12"></a-entity>
            <a-entity class="bubble" sprite-overlay="src:/8w/assets/fx/bubble.png; blend:normal; billboard:true; w:0.40; h:0.60; bob:0.038; bobMs:3100; phase:600;  opacity:0.92" position="-1.15 0.02 0.22"></a-entity>
            <a-entity class="bubble" sprite-overlay="src:/8w/assets/fx/bubble.png; blend:normal; billboard:true; w:0.28; h:0.42; bob:0.03;  bobMs:2700; phase:1300; opacity:0.9"  position="1.15 1.0 -0.15"></a-entity>
            <a-entity class="bubble" sprite-overlay="src:/8w/assets/fx/bubble.png; blend:normal; billboard:true; w:0.32; h:0.48; bob:0.032; bobMs:2400; phase:2100; opacity:0.9"  position="-0.4 -1.1 0.2"></a-entity>
            <a-entity class="bubble" sprite-overlay="src:/8w/assets/fx/bubble.png; blend:normal; billboard:true; w:0.24; h:0.36; bob:0.026; bobMs:2100; phase:2900; opacity:0.86" position="0.95 -1.12 -0.12"></a-entity>
            <!-- fx-lab 이식: 오빗 링(카드 둘레 도는 빛 고리). #stand 90° 회전 하 → 프리뷰로 tilt 검증됨 -->
            <a-entity id="fx-ring" orbit-ring="radius:0.8; tube:0.006; tilt:86; color:#6f6890" position="0 0 0"></a-entity>` : ''}
          </a-entity>
        </a-entity>
      </a-scene>`;
    }

    function setOrient(o){
      orient=o; const st=document.getElementById('stand'); if(st&&st.object3D){
        if(o==='v'){ st.object3D.rotation.set(Math.PI/2,0,0); st.object3D.position.set(0,0,LIFT+Hm/2); } // 수직: 세워 띄움
        else       { st.object3D.rotation.set(0,0,0);        st.object3D.position.set(0,0,LIFT); }        // 수평: 눕혀 띄움
      }
      document.getElementById('tVert').classList.toggle('on', o==='v');
      document.getElementById('tHorz').classList.toggle('on', o==='h');
    }
    function applyDepth(){
      const ff=document.getElementById('frameFront'); if(ff&&ff.object3D) ff.object3D.position.z=GAP;
      // 풍선 z는 각자 position에서 지정(앞/뒤) → 여기서 건드리지 않음
    }
    function applySpark(){ const s=document.getElementById('sparks'); if(s&&s.object3D) s.object3D.visible=showSpark;
      document.getElementById('tSpark').classList.toggle('on',showSpark); }

    // ===== 사진 크기 조절: 폰=두 손가락 핀치 / 데스크톱=마우스 휠 =====
    const clampScale = v => Math.max(0.4, Math.min(3.0, v));
    function applyScale(){ const st=document.getElementById('stand'); if(st&&st.object3D) st.object3D.scale.setScalar(userScale); }
    let pinchD=null, pinchBase=1;
    const dist2=(t)=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
    window.addEventListener('touchstart',(e)=>{ if(e.touches.length===2){ pinchD=dist2(e.touches); pinchBase=userScale; } },{passive:false});
    window.addEventListener('touchmove',(e)=>{ if(e.touches.length===2 && pinchD){ userScale=clampScale(pinchBase*dist2(e.touches)/pinchD); applyScale(); e.preventDefault(); } },{passive:false});
    window.addEventListener('touchend',(e)=>{ if(e.touches.length<2) pinchD=null; });
    window.addEventListener('wheel',(e)=>{ userScale=clampScale(userScale*(e.deltaY<0?1.06:0.94)); applyScale(); },{passive:true});

    // ===== 탭 상호작용: 버블 터뜨리기 / 풍선 툭툭·바람빠짐 =====
    const _ray=new THREE.Raycaster(), _ndc=new THREE.Vector2();
    let _tapX=0,_tapY=0,_tapT=0,_tapOK=false;
    const _canvas=()=>{ const s=document.querySelector('a-scene'); return s&&s.canvas; };
    window.addEventListener('pointerdown',(e)=>{ if(e.isPrimary===false) return;
      _tapX=e.clientX; _tapY=e.clientY; _tapT=performance.now(); _tapOK=(e.target===_canvas()); },{passive:true});
    window.addEventListener('pointerup',(e)=>{ if(!_tapOK) return; _tapOK=false;
      if(Math.hypot(e.clientX-_tapX,e.clientY-_tapY)>12 || performance.now()-_tapT>350) return;  // 드래그/롱프레스 제외
      const scene=document.querySelector('a-scene'), cam=scene&&scene.camera, cv=scene&&scene.canvas; if(!cam||!cv) return;
      const r=cv.getBoundingClientRect();
      _ndc.x=((e.clientX-r.left)/r.width)*2-1; _ndc.y=-((e.clientY-r.top)/r.height)*2+1;
      _ray.setFromCamera(_ndc,cam);
      let best=null;
      const hit=(el,o,type)=>{ if(!o) return; const h=_ray.intersectObject(o,true); if(h.length && (!best||h[0].distance<best.d)) best={el,type,d:h[0].distance}; };
      document.querySelectorAll('.bubble').forEach(b=>hit(b,b.getObject3D('sprite'),'bubble'));
      document.querySelectorAll('.balloon').forEach(b=>hit(b,b.getObject3D('mesh'),'balloon'));
      if(best){ if(best.type==='bubble'){ best.el.emit('pop'); playPop(); } else best.el.emit('poke'); }
    },{passive:true});

    // ── 효과음 (Web Audio, 겹침 재생) ──
    let __actx=null; const __sfx={};
    const SFX={ pop1:'/8w/assets/sfx/bubble-pop-1.mp3', pop2:'/8w/assets/sfx/bubble-pop-2.mp3',
                bop:'/8w/assets/sfx/balloon-bop.mp3', deflate:'/8w/assets/sfx/balloon-deflate.mp3' };
    function initSfx(){   // 사용자 제스처(게이트 탭)에서 호출 → AudioContext 생성·디코딩
      if(__actx) return;
      try{ __actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
      Object.keys(SFX).forEach(k=>fetch(SFX[k]).then(r=>r.arrayBuffer())
        .then(b=>new Promise((res,rej)=>__actx.decodeAudioData(b,res,rej)))
        .then(buf=>{ __sfx[k]=buf; }).catch(()=>{}));
    }
    // opt.dur 지정 시 재생시간을 그 길이(초)에 맞춤(playbackRate로 늘리기/줄이기)
    function playSfx(name,opt){ opt=opt||{};
      if(!__actx) return; if(__actx.state==='suspended') __actx.resume();
      const buf=__sfx[name]; if(!buf) return;
      const src=__actx.createBufferSource(); src.buffer=buf;
      const g=__actx.createGain(); const gain=(opt.gain!=null?opt.gain:0.7); g.gain.value=gain;
      src.connect(g).connect(__actx.destination);
      if(opt.loopDur){   // 어택 1회 + 중간(sustain) 구간만 반복해 loopDur초로 늘림(음정 유지) + 끝 페이드아웃
        src.loopStart=buf.duration*0.28; src.loopEnd=buf.duration*0.72; src.loop=true;
        src.start();
        const end=__actx.currentTime+opt.loopDur;
        g.gain.setValueAtTime(gain, Math.max(__actx.currentTime, end-0.35));
        g.gain.linearRampToValueAtTime(0.0001, end);
        src.stop(end);
      } else {
        src.playbackRate.value = opt.dur ? (buf.duration/opt.dur) : (opt.rate||1);
        src.start();
      }
    }
    function playPop(){ playSfx(Math.random()<0.5?'pop1':'pop2',{gain:0.7}); }   // 버블 터짐(랜덤)
    window.__playSfx = playSfx;   // balloon-poke 컴포넌트에서 사용

    // 사진이 열릴 때 1회: 전역 플래그를 켜면 모든 풍선의 tick이 폴링해 동시에 등장 시작
    function triggerRise(){ if(INTRO) window.__introGo = true; else window.__riseGo = true; }

    // ── 프리뷰 렌더 루프 직접 구동 ──
    // 프리뷰(카메라 없음)에선 8th Wall(XR8)이 renderer의 애니메이션 루프를 점유만 하고
    // 카메라 프레임이 없어 구동하지 않음 → 씬이 초기 몇 프레임 뒤 정지 → 풍선 상승이 중간에 얼어붙음.
    // 우리가 매 프레임 scene.render(time)를 직접 호출해 tick(풍선 상승·반짝이·영상)을 계속 돌린다.
    function driveRenderLoop(sceneEl){
      let lastDrawn = 0;
      const draw = ()=>{ try{ sceneEl.render(performance.now()); }catch(e){} lastDrawn=performance.now(); };
      const rafLoop = ()=>{ draw(); requestAnimationFrame(rafLoop); };           // 보일 때: 60fps 매끄럽게
      const begin = ()=>{
        try{ sceneEl.renderer.setAnimationLoop(null); }catch(e){}                // XR8 점유 해제
        requestAnimationFrame(rafLoop);
        setInterval(()=>{ if(performance.now()-lastDrawn>200) draw(); }, 200);   // 백업: 백그라운드/스로틀로 RAF 멈춰도 진행(보일 땐 조건 거짓→중복 없음)
      };
      (function waitR(){ (sceneEl.renderer) ? begin() : setTimeout(waitR, 30); })();  // renderer 준비될 때까지 대기(타이머—숨김 탭에서도 동작)
    }

    function onXrError(e){
      if(!NOSLAM){ const u=new URL(location.href); u.searchParams.set('noslam','1'); location.replace(u); return; }
      const box=document.getElementById('err'); box.style.display='block';
      box.textContent='AR 엔진 오류 — 안드로이드: Chrome / 아이폰: Safari 로 열어주세요. '+JSON.stringify((e&&e.detail)||'');
    }

    // ================= 버튼 =================
    document.getElementById('tVert').onclick=(e)=>{e.stopPropagation(); setOrient('v');};
    document.getElementById('tHorz').onclick=(e)=>{e.stopPropagation(); setOrient('h');};
    document.getElementById('tSpark').onclick=(e)=>{e.stopPropagation(); showSpark=!showSpark; applySpark();};
    let soundOn=false; const tSnd=document.getElementById('tSnd');
    tSnd.onclick=(e)=>{ e.stopPropagation(); const m=document.getElementById('v'); if(!m) return;
      soundOn=!soundOn; m.muted=!soundOn; if(soundOn) m.play().catch(()=>{}); tSnd.textContent=soundOn?'🔊':'🔇'; };

    // ================= 시작 =================
    let started=false;
    async function startScene(){
      if(started||IN_APP||!ready) return; started=true;
      initSfx();   // 사용자 제스처에서 오디오 컨텍스트 생성 + 효과음 프리로드
      const m=document.getElementById('v');
      try{ m.muted=false; await m.play(); soundOn=true; tSnd.textContent='🔊'; }
      catch(e){ m.muted=true; m.play().catch(()=>{}); soundOn=false; }
      try{ if(window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission==='function') await DeviceMotionEvent.requestPermission(); }catch(e){}
      await mediaReady();
      document.getElementById('gate').style.display='none';
      document.body.insertAdjacentHTML('beforeend', sceneHTML());
      const sceneEl=document.querySelector('a-scene');
      if(!PREVIEW){ sceneEl.addEventListener('xrerror', onXrError); sceneEl.addEventListener('xrimagefound', triggerRise); }  // AR: 마커 인식 시 등장
      else driveRenderLoop(sceneEl);   // 프리뷰: XR8이 점유·정지시킨 렌더 루프를 우리가 직접 돌림(안 그러면 풍선이 상승 도중 멈춤)
      if(PREVIEW) document.getElementById('bar').style.display='flex';   // AR에선 버튼 숨김 — 수직·반짝이·소리 기본 고정
      setTimeout(()=>{
        if(INTRO){ applyDepth(); applyScale(); }                         // 방향·반짝이·풍선·이펙트는 디렉터가 순차 등장
        else { setOrient(orient); applyDepth(); applySpark(); applyScale(); }
        if(PREVIEW) setTimeout(triggerRise, INTRO?700:250);              // 프리뷰: 초기 상태 잠깐 보인 뒤 연출 시작
      }, 300);
    }
    document.getElementById('gate').addEventListener('click', startScene);
  </script>
</body>
