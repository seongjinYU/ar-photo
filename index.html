<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000" />
  <title>기도하는 예수님 · AR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; color:#fff; }
    #container { position: fixed; inset: 0; }
    /* 카메라 권한 실패 등 치명적 오류에서만 노출 */
    #err { position: fixed; inset: 0; z-index: 40; display:none; flex-direction:column;
      align-items:center; justify-content:center; gap:14px; padding:28px; text-align:center; background:#000; }
    #err.show{ display:flex; }
    #err p{ color:#b9bdd4; font-size:14px; max-width:320px; line-height:1.6; margin:0; }
    #err button{ padding:12px 24px;border:none;border-radius:999px;background:#e8c98a;color:#1a1405;font-weight:700;font-size:15px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"></div>
  <div id="err"><p id="errMsg"></p><button onclick="location.reload()">다시 시도</button></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MindARThree } from 'mindar-image-three';

    // 미세조정 (화면엔 아무것도 안 뜸): ?s=0.7&rx=-90&y=0
    // s=크기배율(기본1), rx/ry/rz=회전(도), x/y/z=위치이동
    const q = new URLSearchParams(location.search);
    const num = (k,d)=>{ const v=parseFloat(q.get(k)); return isNaN(v)?d:v; };
    const S=num('s',1), RX=num('rx',0)*Math.PI/180, RY=num('ry',0)*Math.PI/180, RZ=num('rz',0)*Math.PI/180;
    const PX=num('x',0), PY=num('y',0), PZ=num('z',0);
    const TARGET = 0.9; // 마커(폭=1) 대비 캐릭터 최대치수 목표

    function showErr(m){ document.getElementById('errMsg').innerHTML=m; document.getElementById('err').classList.add('show'); }

    async function main(){
      try {
        const mindarThree = new MindARThree({
          container: document.getElementById('container'),
          imageTargetSrc: './assets/target.mind',
          uiLoading: 'no', uiScanning: 'no', uiError: 'no',
          filterMinCF: 0.0001,   // 지터 최소화 (QR에 '고정'된 느낌)
          filterBeta: 0.001,
        });
        const { renderer, scene, camera } = mindarThree;

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.1));
        const dir = new THREE.DirectionalLight(0xffffff, 1.0); dir.position.set(1,2,1); scene.add(dir);

        const draco = new DRACOLoader();
        draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/libs/draco/');
        const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
        const gltf = await loader.loadAsync('./assets/model-opt.glb');
        const model = gltf.scene;

        // 회전 먼저 적용 후, 마커 크기에 맞춰 자동 축소 + 중앙 정렬
        model.rotation.set(RX, RY, RZ);
        model.updateWorldMatrix(true, true);
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3(); box.getSize(size);
        const center = new THREE.Vector3(); box.getCenter(center);
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const fit = (TARGET / maxDim) * S;
        model.scale.setScalar(fit);
        model.position.set(-center.x*fit + PX, -center.y*fit + PY, -center.z*fit + PZ);

        const anchor = mindarThree.addAnchor(0);
        anchor.group.add(model);

        await mindarThree.start();

        // ★ iOS 검은화면 우회: 카메라 영상을 3D 배경 텍스처로 직접 렌더
        const video = mindarThree.video;
        const tex = new THREE.VideoTexture(video);
        tex.colorSpace = THREE.SRGBColorSpace;
        const bgScene = new THREE.Scene();
        const bgCam = new THREE.Camera();
        const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2,2),
          new THREE.MeshBasicMaterial({ map: tex, depthTest:false, depthWrite:false }));
        bgScene.add(bgMesh);
        function cover(){
          const vw=video.videoWidth, vh=video.videoHeight; if(!vw||!vh) return;
          const va=vw/vh, sa=window.innerWidth/window.innerHeight;
          let rx=1, ry=1; if(va>sa){ rx=sa/va; } else { ry=va/sa; }
          tex.repeat.set(rx,ry); tex.offset.set((1-rx)/2,(1-ry)/2);
        }

        renderer.autoClear = false;
        renderer.setAnimationLoop(() => {
          cover();
          renderer.clear();
          renderer.render(bgScene, bgCam);   // 카메라 영상
          renderer.clearDepth();
          renderer.render(scene, camera);     // QR에 고정된 캐릭터
        });
      } catch (e) {
        const msg = (e && e.name === 'NotAllowedError')
          ? '카메라 권한이 필요해요. 브라우저 설정에서 카메라를 허용해 주세요.'
          : '오류: ' + (e && e.message || e) + '<br/>(사파리/크롬에서 HTTPS로 열었는지 확인해 주세요.)';
        showErr(msg);
      }
    }
    main();
  </script>
</body>
</html>
