<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0c0e1c" />
  <title>기도하는 예수님 AR</title>

  <!-- A-Frame + MindAR (이미지 트래킹) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Pretendard", "Noto Sans KR", sans-serif; background: #0c0e1c; color: #fff; }

    /* A-Frame 캔버스는 투명해야 뒤의 카메라 영상이 보임 */
    a-scene { background: transparent !important; }
    canvas.a-canvas, .a-canvas { background: transparent !important; }
    /* MindAR이 삽입하는 카메라 영상이 화면 전체를 덮도록 보정 */
    video { object-fit: cover; }

    /* 상단 안내 배너 */
    #banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: max(env(safe-area-inset-top), 14px) 16px 12px;
      font-size: 14px; font-weight: 500; text-align: center;
      background: linear-gradient(180deg, rgba(12,14,28,0.85), rgba(12,14,28,0));
      pointer-events: none; transition: opacity 0.4s ease;
    }
    #banner .dot { width: 8px; height: 8px; border-radius: 50%; background: #e8c98a; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.35;transform:scale(.8);} 50%{opacity:1;transform:scale(1.2);} }

    /* 스캔 안내(마커 못 찾았을 때) */
    #scanHint {
      position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%); z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 0 24px; text-align: center; transition: opacity 0.4s ease; pointer-events: none;
    }
    #scanHint .frame { width: 128px; height: 128px; border-radius: 18px;
      border: 2px dashed rgba(255,255,255,0.55); position: relative; }
    #scanHint .frame::after { content:""; position:absolute; left:8px; right:8px; height:2px;
      background: #e8c98a; box-shadow: 0 0 12px #e8c98a; top: 8px; border-radius: 2px;
      animation: scanline 2s ease-in-out infinite; }
    @keyframes scanline { 0%,100%{ top: 8px; } 50%{ top: calc(100% - 10px);} }
    #scanHint p { margin: 0; font-size: 14px; color: #eef; line-height: 1.5;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
    #scanHint.hidden { opacity: 0; }

    /* 로딩/에러 오버레이 */
    .overlay {
      position: fixed; inset: 0; z-index: 30; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 28px; text-align: center;
      background: radial-gradient(120% 80% at 50% 0%, #2a3160, #0c0e1c 80%);
    }
    .overlay.show { display: flex; }
    .spinner { width: 46px; height: 46px; border-radius: 50%;
      border: 3px solid rgba(232,201,138,0.25); border-top-color: #e8c98a;
      animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay h2 { margin: 6px 0 0; font-size: 18px; font-weight: 600; }
    .overlay p { margin: 0; font-size: 14px; color: #b9bdd4; line-height: 1.6; max-width: 320px; }
    .overlay button { margin-top: 10px; padding: 12px 24px; border-radius: 999px; border: none;
      font-size: 15px; font-weight: 600; color:#1a1405; cursor: pointer;
      background: linear-gradient(180deg,#f3e2bd,#e8c98a); }
  </style>
</head>
<body>
  <!-- 상단 배너 -->
  <div id="banner">
    <span class="dot"></span>
    <span id="bannerText">카메라를 마커 그림에 비춰보세요</span>
  </div>

  <!-- 스캔 안내 (마커 탐색 중일 때만 표시) -->
  <div id="scanHint">
    <div class="frame"></div>
    <p>마커 그림 전체가<br/>화면에 들어오게 비춰주세요</p>
  </div>

  <!-- 로딩 오버레이 -->
  <div class="overlay show" id="loading">
    <div class="spinner"></div>
    <h2>준비 중…</h2>
    <p>카메라와 3D 모델을 불러오고 있어요.<br/>카메라 권한을 허용해 주세요.</p>
  </div>

  <!-- 에러 오버레이 -->
  <div class="overlay" id="error">
    <h2 id="errTitle">문제가 발생했어요</h2>
    <p id="errMsg"></p>
    <button onclick="location.reload()">다시 시도</button>
  </div>

  <!-- MindAR 씬 -->
  <a-scene
    mindar-image="imageTargetSrc: ./assets/target.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true, antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="jesusModel" src="./assets/model.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex:0 = target.mind의 첫 번째(그리고 유일한) 마커 -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- ▼▼ 캐릭터 위치/크기/회전 조정 지점 (표시 상태 보고 여기만 바꾸면 됨) ▼▼ -->
      <a-gltf-model
        id="jesus"
        src="#jesusModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.45 0.45 0.45"
        animation-mixer>
      </a-gltf-model>
      <!-- ▲▲ position: 좌우/상하/앞뒤 · rotation: 세우기(90 0 0이면 카드 위로 섬) · scale: 크기 ▲▲ -->
    </a-entity>
  </a-scene>

  <script>
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('error');
    const errTitle = document.getElementById('errTitle');
    const errMsg = document.getElementById('errMsg');
    const scanHint = document.getElementById('scanHint');
    const bannerText = document.getElementById('bannerText');
    const scene = document.querySelector('a-scene');

    function showError(title, msg) {
      loading.classList.remove('show');
      errTitle.textContent = title;
      errMsg.innerHTML = msg;
      errorBox.classList.add('show');
    }

    // AR 준비 완료 → 로딩 숨김
    scene.addEventListener('arReady', () => {
      loading.classList.remove('show');
    });

    // MindAR 내부 에러 (주로 카메라 권한 거부)
    scene.addEventListener('arError', () => {
      showError('카메라를 열 수 없어요',
        '카메라 권한을 허용해 주세요.<br/>또는 이 페이지가 <b>HTTPS 주소</b>인지 확인해 주세요. (카메라 AR은 HTTPS에서만 동작)');
    });

    // 마커 찾음 / 잃음 → 안내 토글
    const target = document.querySelector('[mindar-image-target]');
    target.addEventListener('targetFound', () => {
      scanHint.classList.add('hidden');
      bannerText.textContent = '찾았어요! 🙏 천천히 움직여 보세요';
    });
    target.addEventListener('targetLost', () => {
      scanHint.classList.remove('hidden');
      bannerText.textContent = '카메라를 마커 그림에 비춰보세요';
    });

    // getUserMedia 미지원/차단 안전망
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('카메라를 쓸 수 없는 환경이에요',
        'HTTPS 주소에서 지원되는 브라우저(사파리/크롬)로 열어주세요.');
    }

    // 모델 로딩 실패 감지
    document.getElementById('jesus').addEventListener('model-error', () => {
      showError('3D 모델을 불러오지 못했어요', '네트워크를 확인한 뒤 다시 시도해 주세요.');
    });
  </script>
</body>
</html>
